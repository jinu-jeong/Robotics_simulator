[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robotics-sim"
version = "0.1.0"
description = "Portable robotics simulation engine (rigid + FEM + contact) using Taichi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "taichi>=1.7.0",
    "pytest>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["sim/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

