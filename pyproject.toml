[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robosim"
version = "0.1.0"
description = "3D Robotics Simulator with hybrid Rigid Body Dynamics and FEM"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "trimesh>=3.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-benchmark",
    "mypy",
]
fem = [
    "meshio>=5.3",
    "tetgen>=0.6",
]
rl = [
    "gymnasium>=1.0",
]

[tool.setuptools.packages.find]
include = ["robosim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
