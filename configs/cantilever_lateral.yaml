# Cantilever verification with the *lateral* (inner-face, −y) tip load – the same
# loading direction as the two-finger grasp (Stages D/E) and the Fig. 1 scenes.
#
# Bending is about z with I = H W^3 / 12 (thickness W = 20 mm, L/W = 5, so the
# Timoshenko shear term is ~3 % instead of ~1 % for the top-face benchmark).
# Same finger / material as configs/grasp.yaml.

geometry:
  length: 0.100
  width:  0.020
  height: 0.010

material:
  name: "TPU-like compliant polymer"
  youngs_modulus: 5.0e7
  poisson_ratio: 0.40

load:
  force_magnitude: 1.0          # [N], applied in -y on the end face (pressing the inner face)
  direction: [0.0, -1.0, 0.0]

# (nx, ny, nz) H20/T10 cells. ny is the count across the bending thickness. Coarse to fine.
# 1×1×1 … 80×12×6 spans h_char ≈ 27 mm … 1.4 mm (Fig. 1 panel 03 convergence axis).
refinement:
  - [1, 1, 1]
  - [2, 1, 1]
  - [3, 1, 1]
  - [5, 1, 1]
  - [10, 2, 2]
  - [20, 4, 2]
  - [30, 6, 3]
  - [40, 8, 4]
refinement_fine:
  - [60, 12, 6]
  - [80, 12, 6]

target_relative_error: 0.10

output_dir: results/etc/cantilever_lateral
plot_copy: results/etc/figures/lateral/03_fem_convergence_lateral.png
seed: 0
