# Compliant finger geometry, mesh and material (SI units: m, N, Pa, kg/m^3).
#
# Coordinate convention (used everywhere in the project):
#   x : finger length direction. Root surface at x = 0 is fully fixed.
#   y : finger width direction.
#   z : finger thickness direction ("up"). Contact normally pushes in -z on
#       the top surface (z = height).
#
# Milestone 0A only uses `geometry` and `mesh` (viewer demo); `material`
# becomes active with the FEM solver in Milestone 1.

geometry:
  length: 0.100    # L [m]
  width:  0.020    # W [m]
  height: 0.010    # H [m]

mesh:
  # Hex-dominant quadratic mesh (commercial-mesher style): structured 20-node
  # hexahedra (H20) over the finger, the last `tet_fraction` of the length at
  # the tip meshed with 10-node tetrahedra (T10, Kuhn split) and tied to the
  # hexes with hanging-node constraints. Resolution is set by the target edge
  # length `element_size` [m] (default: smallest dimension / 4 = 2.5 mm ->
  # 40 x 8 x 4 cells, ~7.9k nodes, ~24k DOF). nx / ny / nz may still be given
  # to override single axes. Lateral cantilever benchmark: 20x4x2 -> -1.1 %,
  # 40x8x4 -> -0.9 % tip deflection vs Timoshenko (T4 needed 80x16x8 for -4 %).
  element_size: 0.0025
  tet_fraction: 0.2

material:
  # TPU-like compliant polymer. With L=0.1, W=0.02, H=0.01 a 1 N tip load
  # gives delta = F L^3 / (3 E I) = 4 mm (4 % of L) -> small-deformation regime.
  # (A 2 MPa silicone would deflect 100 mm at 1 N and violate the assumption.)
  name: "TPU-like compliant polymer"
  youngs_modulus: 5.0e7    # E [Pa]
  poisson_ratio: 0.40      # nu [-]
  density: 1200.0          # rho [kg/m^3] (self-weight body force when gravity.enabled)

# Self-weight (quasi-static body force rho*g). Point-contact solves stay
# gravity-free; demos add FingerFEMModel.gravity_displacement() by superposition
# so the beam-theory verification and the contact datasets are unaffected.
gravity:
  enabled: true
  vector: [0.0, 0.0, -9.80665]   # world frame [m/s^2]

boundary_conditions:
  fixed_surface: root       # fully clamped surface at x = 0 (u_x = u_y = u_z = 0)
  tolerance: 1.0e-9         # node selection tolerance [m]

loading:
  # Default single point contact used by demos.
  contact_position_rel: [0.90, 0.50, 1.00]   # fractions of (L, W, H) -> top surface near tip
  force_magnitude: 1.0                       # [N]
  force_direction: [0.0, 0.0, -1.0]          # unit vector, pressing down on top surface
