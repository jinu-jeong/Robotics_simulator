# Consecutive-frame filters on q (same cameras / noise as the current dataset).
e2e_config: e2e
vision_config: vision
seed: 0
output_dir: results/etc/e2e

n_views: 2
noise_px: 0.5
width: 192
height: 144
n_frames: 32
frame_counts: [1, 2, 4, 8, 16, 32]
max_samples: 200

n_iter: 2
huber_px: 1.5
geometric_ridge: 1.0e-4

ema_alpha: 0.25
kalman_process: 1.0e-8      # tiny → recursive mean on a hold
kalman_measure: 1.0e-4
kalman_process_ramp: 3.0e-6 # larger so a slow squeeze can move
ramp_start: 0.3             # u(t) = lerp(start, 1) * u_hold
